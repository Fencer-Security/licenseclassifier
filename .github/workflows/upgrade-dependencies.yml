name: Upgrade dependencies

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * THU"

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Update uv.lock
        run: |
          uv lock --upgrade
          if git diff --quiet uv.lock 2>/dev/null; then
            printf "_No lockfile updates needed._\n" > uv-update.log
          else
            printf "### uv.lock\n\nuv.lock was updated with the latest compatible versions.\n" > uv-update.log
          fi

      - name: Update pinned GitHub Action SHAs
        continue-on-error: true
        env:
          PINACT_VERSION: 3.10.1
          PINACT_SHA256: c5234ff3a636cda47719c73ca33a0183a5f441581455eda8a0726e5030942b69
        run: |
          curl -fsSL -o /tmp/pinact.tar.gz \
              "https://github.com/suzuki-shunsuke/pinact/releases/download/v${PINACT_VERSION}/pinact_linux_amd64.tar.gz"
          echo "${PINACT_SHA256}  /tmp/pinact.tar.gz" | sha256sum -c -
          tar -xzf /tmp/pinact.tar.gz -C /tmp pinact
          /tmp/pinact run --update >/tmp/pinact.out 2>&1 || true
          printf "### GitHub Actions SHAs\n\n" > update.log
          if grep -q '^::notice' /tmp/pinact.out; then
              printf "| File | Updated |\n|---|---|\n" >> update.log
              sed -nE 's|^::notice file=([^,]+),line=[0-9]+,title=[^:]+::[[:space:]]*(.*)$|\1\x01\2|p' \
                  /tmp/pinact.out \
                  | awk -F$'\x01' '{printf "| `%s` | `%s` |\n", $1, $2}' \
                  >> update.log
          else
              printf "_No action SHA updates needed._\n" >> update.log
          fi

      - name: Assemble the PR body
        run: |
          cat uv-update.log > body.md
          echo >> body.md
          cat update.log >> body.md

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          commit-message: Upgrade dependencies
          branch: bot/upgrade-dependencies
          delete-branch: true
          sign-commits: true
          title: "Weekly dependency upgrades"
          body-path: body.md
          add-paths: |
            .github/workflows/*.yml
            uv.lock
          team-reviewers: |
            engineering
