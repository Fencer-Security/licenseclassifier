# Watch for a new SPDX License List release and open a pull request with the corpus refreshed
# against it.
#
# The pull request is the deliverable, not the merge. Every pattern in it was machine-converted
# from an SPDX matching template, and while the gate proves each one identifies its own license
# and claims nobody else's canonical text, it cannot tell whether the pattern is right about the
# wording that appears in real files. That needs a person, which is why nothing here merges or
# releases anything.
name: spdx-refresh

on:
  schedule:
    # Monthly. SPDX ships a few releases a year, so anything more frequent is just noise.
    - cron: "17 4 1 * *"
  workflow_dispatch:
    inputs:
      release:
        description: "SPDX release tag to refresh to (default: the latest)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Refresh the corpus
        id: refresh
        run: |
          uv sync --group test
          # Exits non-zero when the gate finds something unexpected. The pull request is opened
          # either way: a gate failure is the most important thing a refresh can report, and it
          # is much easier to read as a diff than as a log.
          uv run python -m tools.refresh_spdx \
            ${{ inputs.release && format('--release {0}', inputs.release) || '' }} \
            --summary-file "$RUNNER_TEMP/summary.md" | tee "$RUNNER_TEMP/gate.log" \
            && echo "gate=pass" >> "$GITHUB_OUTPUT" \
            || echo "gate=fail" >> "$GITHUB_OUTPUT"

      - name: Check whether anything changed
        id: diff
        run: |
          # .spdx-release/ is the downloaded upstream tree, not part of the corpus.
          rm -rf .spdx-release
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Corpus is already up to date with the latest SPDX release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the test suite
        if: steps.diff.outputs.changed == 'true'
        continue-on-error: true
        id: tests
        run: uv run pytest -q

      - name: Assemble the pull request body
        if: steps.diff.outputs.changed == 'true'
        run: |
          {
            cat "$RUNNER_TEMP/summary.md"
            echo
            echo "## Checks"
            echo
            echo "- Corpus gate: **${{ steps.refresh.outputs.gate }}**"
            echo "- Test suite: **${{ steps.tests.outcome }}**"
            echo
            echo "<details><summary>Gate output</summary>"
            echo
            echo '```'
            tail -n 60 "$RUNNER_TEMP/gate.log"
            echo '```'
            echo
            echo "</details>"
            echo
            echo "Generated by \`.github/workflows/spdx-refresh.yml\`. Do not merge on green alone:"
            echo "the gate proves each new pattern identifies its own canonical text and steals"
            echo "nobody else's, not that it matches the wording real files use."
          } > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: steps.diff.outputs.changed == 'true'
        id: generate-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Open the pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          branch: spdx-refresh
          title: "Refresh the license corpus from the latest SPDX release"
          body-path: ${{ runner.temp }}/body.md
          commit-message: "data: refresh the license corpus from the latest SPDX release"
          labels: corpus
          delete-branch: true
          sign-commits: true
